name: Deploy

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx --no-install playwright-core install --with-deps chromium

      - name: Deploy main
        if: github.ref_name == 'main'
        run: |
          npx --no-install wrangler deploy
          version=$(npx --no-install wrangler deployments status --json | jq -r '.versions | max_by(.percentage) | .version_id')
          echo "SLICCY_AI_VERSION=$version" >> "$GITHUB_ENV"

      - name: Add the branch to the deployment at 0%
        if: github.ref_name != 'main'
        run: |
          stable=$(npx --no-install wrangler deployments status --json | jq -r '.versions | max_by(.percentage) | .version_id')
          echo "SLICCY_AI_STABLE=$stable" >> "$GITHUB_ENV"
          version=$(npx --no-install wrangler versions upload --tag "${GITHUB_SHA::12}" --message "$GITHUB_REF_NAME" | sed -nE 's/.*Worker Version ID: ([0-9a-f-]+).*/\1/p')
          test -n "$version"
          echo "SLICCY_AI_VERSION=$version" >> "$GITHUB_ENV"
          npx --no-install wrangler versions deploy "$stable@100%" "$version@0%" -y --message "post-deploy tests for $GITHUB_REF_NAME"

      - name: Post-deploy tests
        run: |
          echo "Testing sliccy-ai version $SLICCY_AI_VERSION" >> "$GITHUB_STEP_SUMMARY"
          npm run test:live

      - name: Take the branch back out
        if: always() && github.ref_name != 'main' && env.SLICCY_AI_STABLE != ''
        run: npx --no-install wrangler versions deploy "$SLICCY_AI_STABLE@100%" -y --message "post-deploy tests for $GITHUB_REF_NAME done"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: post-deploy
          path: artifacts/
          if-no-files-found: ignore
